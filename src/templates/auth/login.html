{% extends "base.html" %} {% block content %}
<div>
  <div class="header">
    <div class="header-title">
      <p class="system-label">AUSTRALIAN OUTDOOR EQUIPMENT</p>
      <p class="display">TrailHire</p>
    </div>
  </div>
  <div class="card" style="margin: var(--space-8) 0; width: 50%">
    <form method="post">
      <div class="input-group">
        <label for="email" class="label input-label">E-Mail</label>
        <input
          type="email"
          id="email"
          class="input"
          name="email"
          placeholder="example@email.com"
          required
        />
      </div>
      <div class="input-group">
        <label for="password" class="label input-label">Password</label>
        <input
          type="password"
          id="password"
          class="input"
          name="password"
          required
        />
      </div>
      <input
        type="submit"
        value="Log In"
        class="btn btn-primary motion-up-hover motion-down-active easing-base submit"
      />
      {% if msg %}
      <p class="label auth" style="color: var(--danger)">{{ msg }}</p>
      {% endif %}
    </form>
    <a href="./signup" style="text-align: center">New here? Sign up</a>
    <a href="./reset" style="text-align: center">Forgot password?</a>
  </div>
  {% endblock %}
</div>
